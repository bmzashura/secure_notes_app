name: secure_notes
description: SecureNotes — Catatan Terenkripsi End-to-End
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Networking
  dio: ^5.4.3+1

  # Secure Storage (Android Keystore / iOS Keychain)
  flutter_secure_storage: ^9.2.2

  # Encryption
  encrypt: ^5.0.3
  pointycastle: ^3.9.1

  # PIN Input
  pinput: ^4.0.0

  # Biometric Auth
  local_auth: ^2.2.0

  # Functional
  dartz: ^0.10.1  # Either type
  get_it: ^7.7.0  # Service locator

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

  # Utils
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
